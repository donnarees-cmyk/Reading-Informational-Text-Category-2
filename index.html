<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category 2: Reading Informational Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>.tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: bold; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <header class="bg-emerald-700 text-white p-6 shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-emerald-900 text-emerald-200 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">Category 2 Review</span>
                <h1 class="text-2xl font-bold mt-1">Reading Informational Text</h1>
            </div>
            <div class="bg-emerald-800 px-4 py-2 rounded-lg border border-emerald-600 text-center">
                <p class="text-xs text-emerald-200 uppercase font-semibold">Mastery Score</p>
                <p id="score-display" class="text-2xl font-black text-yellow-300">0 / 4</p>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex overflow-x-auto bg-white rounded-xl shadow-sm border p-2 gap-2">
            <button onclick="switchStandard(0)" id="tab-0" class="tab-btn tab-active px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.2.1 (Text Structure)</button>
            <button onclick="switchStandard(1)" id="tab-1" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.2.2 (Central Idea)</button>
            <button onclick="switchStandard(2)" id="tab-2" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.2.3 (Author's Purpose)</button>
            <button onclick="switchStandard(3)" id="tab-3" class="tab-btn px-4 py-2 rounded-lg text-sm whitespace-nowrap">ELA.6.R.2.4 (Argument & Reasoning)</button>
        </div>

        <!-- BENCHMARK TUTORIAL & ANCHOR CHART AT TOP -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm space-y-3">
            <div class="flex items-center gap-2 text-emerald-900 font-bold text-lg">
                <i class="fas fa-graduation-cap text-emerald-600"></i>
                <h2 id="standard-title">Standard Tutorial Loading...</h2>
            </div>
            <div class="bg-white p-4 rounded-lg border border-emerald-100 text-sm md:text-base leading-relaxed" id="standard-teaching"></div>
        </div>

        <!-- READ ALOUD CONTROLS WITH VOICE SELECTOR -->
        <div class="bg-white rounded-xl shadow-sm border p-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button onclick="playTTS()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">
                    <i class="fas fa-volume-up"></i> Read Aloud
                </button>
                <button onclick="pauseTTS()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg"><i class="fas fa-pause"></i> Pause</button>
                <button onclick="stopTTS()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg"><i class="fas fa-stop"></i> Stop</button>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase"><i class="fas fa-user-gear"></i> Voice:</label>
                    <select id="voice-select" onchange="stopTTS()" class="bg-slate-100 border rounded px-2 py-1 text-sm max-w-[200px] font-medium"></select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase">Speed:</label>
                    <select id="speed-select" onchange="updateSpeed()" class="bg-slate-100 border rounded px-2 py-1 text-sm">
                        <option value="0.8">0.8x (Slow)</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                        <option value="1.2">1.2x (Fast)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- PASSAGE & QUESTION -->
        <div class="bg-white border rounded-xl shadow-sm p-6 space-y-6">
            <div>
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider block mb-1">Informational Passage</span>
                <div id="passage-text" class="bg-slate-50 p-4 rounded-lg border text-slate-800 font-serif leading-relaxed text-base whitespace-pre-line"></div>
            </div>
            <hr/>
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Question</span>
                <p id="question-text" class="text-slate-900 font-semibold text-lg mb-4"></p>
                <div id="options-container" class="space-y-3"></div>
            </div>
            <div id="feedback-box" class="hidden rounded-xl p-5"></div>
        </div>
    </main>

    <script>
        const standards = [
            {
                code: "ELA.6.R.2.1",
                title: "Text Structure & Features",
                teaching: "<b>TUTORIAL LESSON:</b> Informational text structures organize ideas logically:<br/>• <b>Cause & Effect:</b> Explains why something happens and what results.<br/>• <b>Problem & Solution:</b> Presents a conflict and how it is resolved.<br/>• <b>Compare & Contrast:</b> Shows similarities and differences.",
                passage: "Subheading: Urban Heat Islands\nCities experience higher temperatures than rural areas due to dense concrete absorbing heat during the day. As a result, energy demands for air conditioning spike sharply during summer months.",
                question: "Which text structure is used in this section?",
                options: [
                    { text: "Problem and Solution", correct: false, explain: "Incorrect. The text states a cause and effect, but offers no solution." },
                    { text: "Cause and Effect", correct: true, explain: "Great job! Dense concrete (cause) leads to higher temperatures and energy spikes (effect)." },
                    { text: "Chronological Order", correct: false, explain: "Incorrect. There is no timeline or step-by-step sequence." },
                    { text: "Compare and Contrast", correct: false, explain: "Incorrect. The passage focuses on explaining why heat builds up." }
                ]
            },
            {
                code: "ELA.6.R.2.2",
                title: "Central Idea & Supporting Details",
                teaching: "<b>TUTORIAL LESSON:</b> The <b>Central Idea</b> is the primary takeaway of a text.<br/>• <i>Strategy:</i> Combine the main topic with what the author claims about it.<br/>• <i>Supporting Details:</i> Facts, statistics, and examples that prove the central idea.",
                passage: "Deep-sea hydrothermal vents harbor thriving ecosystems completely independent of sunlight. Bacteria use chemicals from vent fluid to generate food through chemosynthesis, sustaining giant tube worms, blind crabs, and shrimp.",
                question: "What is the central idea of this informational text?",
                options: [
                    { text: "Sunlight is required for all living organisms on Earth to survive.", correct: false, explain: "Incorrect. The text states these ecosystems are independent of sunlight." },
                    { text: "Hydrothermal vents produce hot water that warms deep ocean currents.", correct: false, explain: "Incorrect. Water temperature is not the main focus." },
                    { text: "Unique ecosystems thrive in the deep sea without sunlight by relying on chemical energy.", correct: true, explain: "Spot on! The text focuses on how sea creatures survive independently of sunlight." },
                    { text: "Giant tube worms are the most dominant predators in ocean trenches.", correct: false, explain: "Incorrect. Tube worms are just one supporting detail." }
                ]
            },
            {
                code: "ELA.6.R.2.3",
                title: "Author's Purpose & Perspective Across Texts",
                teaching: "<b>TUTORIAL LESSON:</b> Multiple authors writing on the same event often hold contrasting viewpoints based on their goals (to inform, persuade, or caution).",
                passage: "Text 1: 'Commercial drone deliveries will revolutionize logistics by reducing road traffic and carbon emissions.'\nText 2: 'Widespread drone delivery threatens neighborhood privacy and creates disruptive low-altitude noise pollution.'",
                question: "How do the perspectives of the authors in Text 1 and Text 2 differ?",
                options: [
                    { text: "Text 1 highlights environmental benefits, while Text 2 emphasizes quality-of-life concerns.", correct: true, explain: "Exactly right! Text 1 focuses on traffic/emissions benefits, while Text 2 highlights privacy and noise drawbacks." },
                    { text: "Text 1 argues drones are too expensive, while Text 2 claims they save money.", correct: false, explain: "Incorrect. Cost is not discussed." },
                    { text: "Both authors agree that drone deliveries should be banned immediately.", correct: false, explain: "Incorrect. Text 1 supports drone delivery." },
                    { text: "Text 2 is written to entertain readers with a fictional story.", correct: false, explain: "Incorrect. Text 2 presents informational concerns." }
                ]
            },
            {
                code: "ELA.6.R.2.4",
                title: "Argument & Logical Reasoning",
                teaching: "<b>TUTORIAL LESSON:</b> Evaluate an author's argument by checking if claims are supported by strong evidence or flawed logic (such as a <i>hasty generalization</i> based on just one experience).",
                passage: "Claim: 'Our school district must adopt a four-day school week. Last week, one student said he felt much more rested after a long weekend.'",
                question: "Which evaluation best describes the strength of the author's supporting argument?",
                options: [
                    { text: "The argument is strong because it includes direct student testimonies.", correct: false, explain: "Incorrect. A single student's opinion does not provide sufficient proof." },
                    { text: "The argument is weak because it relies on a single anecdotal observation (hasty generalization).", correct: true, explain: "Correct! Relying on one student's comment is an insufficient sample size." },
                    { text: "The argument is strong because four-day school weeks double test scores.", correct: false, explain: "Incorrect. No test score data is provided." },
                    { text: "The argument is weak because the author uses harsh, insulting language.", correct: false, explain: "Incorrect. The flaw is insufficient evidence, not harsh language." }
                ]
            }
        ];

        let currentIdx = 0;
        let answered = new Array(standards.length).fill(false);
        let score = 0;
        let synth = window.speechSynthesis;
        let availableVoices = [];

        function initVoices() {
            if(!('speechSynthesis' in window)) return;
            availableVoices = synth.getVoices();
            const voiceSelect = document.getElementById('voice-select');
            voiceSelect.innerHTML = '';

            let googleVoices = availableVoices.filter(v => v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha"));
            let listToUse = googleVoices.length > 0 ? googleVoices : availableVoices;

            listToUse.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.innerText = v.name.replace('Google', 'Google Voice').replace('Microsoft', 'Natural');
                if (v.name.includes("Google US English") || v.name.includes("Natural") || (i === 0 && !voiceSelect.value)) {
                    opt.selected = true;
                }
                voiceSelect.appendChild(opt);
            });
        }

        if ('speechSynthesis' in window) {
            synth.onvoiceschanged = initVoices;
            initVoices();
        }

        function loadStandard(index) {
            currentIdx = index;
            const std = standards[index];
            document.querySelectorAll('.tab-btn').forEach((b, i) => i === index ? b.classList.add('tab-active') : b.classList.remove('tab-active'));
            document.getElementById('standard-title').innerText = `${std.code} - ${std.title}`;
            document.getElementById('standard-teaching').innerHTML = std.teaching;
            document.getElementById('passage-text').innerText = std.passage;
            document.getElementById('question-text').innerText = std.question;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            std.options.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border hover:border-emerald-400 hover:bg-emerald-50/50 transition flex items-start gap-3 font-medium";
                btn.onclick = () => selectOption(oIdx);
                btn.innerHTML = `<span class="bg-slate-100 border text-slate-600 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + oIdx)}</span> <span>${opt.text}</span>`;
                optsContainer.appendChild(btn);
            });
            document.getElementById('feedback-box').className = "hidden rounded-xl p-5";
            stopTTS();
        }

        function selectOption(oIdx) {
            const std = standards[currentIdx];
            const selected = std.options[oIdx];
            const fbBox = document.getElementById('feedback-box');
            fbBox.className = "rounded-xl p-5";

            if(selected.correct) {
                fbBox.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-900');
                fbBox.innerHTML = `<div class="flex items-center gap-2 font-bold text-lg mb-1 text-emerald-800"><i class="fas fa-check-circle"></i> Excellent Work!</div><p>${selected.explain}</p>`;
                if(!answered[currentIdx]) { score++; answered[currentIdx] = true; document.getElementById('score-display').innerText = `${score} / ${standards.length}`; }
            } else {
                fbBox.classList.add('bg-rose-50', 'border', 'border-rose-200', 'text-rose-900');
                fbBox.innerHTML = `<div class="flex items-center gap-2 font-bold text-lg mb-1 text-rose-800"><i class="fas fa-exclamation-circle"></i> Corrective Re-Teaching</div><p>${selected.explain}</p>`;
            }
            speakText(selected.explain);
        }

        function switchStandard(idx) { loadStandard(idx); }

        function speakText(text) {
            stopTTS();
            if(!('speechSynthesis' in window)) return;
            const textToSpeak = text || `${standards[currentIdx].teaching.replace(/<[^>]*>/g, '')}. Passage: ${standards[currentIdx].passage}. Question: ${standards[currentIdx].question}`;
            const utt = new SpeechSynthesisUtterance(textToSpeak);
            utt.rate = parseFloat(document.getElementById('speed-select').value);
            
            const selectedVoiceName = document.getElementById('voice-select').value;
            const chosenVoice = availableVoices.find(v => v.name === selectedVoiceName);
            if(chosenVoice) utt.voice = chosenVoice;

            synth.speak(utt);
        }

        function playTTS() { speakText(); }
        function pauseTTS() { if(synth.speaking && !synth.paused) synth.pause(); else if(synth.paused) synth.resume(); }
        function stopTTS() { if(synth.speaking) synth.cancel(); }
        function updateSpeed() { if(synth.speaking) { stopTTS(); playTTS(); } }
        loadStandard(0);
    </script>
</body>
</html>
